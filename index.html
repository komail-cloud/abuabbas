<div id="firebaseLogin" style="
position:fixed;inset:0;z-index:20000;
background:#101010;color:#f5d36a;
display:flex;align-items:center;justify-content:center;
padding:20px;text-align:center">
  <div style="width:100%;max-width:380px">
    <h1>أبو عباس</h1>
    <h2>تسجيل الدخول</h2>
    <input id="fbEmail" type="email" placeholder="البريد الإلكتروني">
    <br><br>
    <input id="fbPassword" type="password" placeholder="كلمة المرور">
    <br><br>
    <button id="fbLogin">دخول</button>
    <p id="fbStatus"></p>
  </div>
</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
 getAuth, signInWithEmailAndPassword,
 onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
 getDatabase, ref, get, set, onValue
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
 apiKey: "AIzaSyBHrcEY6n-J7za-4bPNs8ywnU6EauslTug",
 authDomain: "abu-abbas.firebaseapp.com",
 databaseURL: "https://abu-abbas-default-rtdb.firebaseio.com",
 projectId: "abu-abbas",
 storageBucket: "abu-abbas.firebasestorage.app",
 messagingSenderId: "863423401268",
 appId: "1:863423401268:web:e89111c6503f80caa82961",
 measurementId: "G-Y2299RY8T5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const loginBox = document.getElementById("firebaseLogin");
const status = document.getElementById("fbStatus");
const loginButton = document.getElementById("fbLogin");

loginButton.onclick = async () => {
 const email = document.getElementById("fbEmail").value.trim();
 const password = document.getElementById("fbPassword").value;

 try {
  status.textContent = "جاري تسجيل الدخول...";
  await signInWithEmailAndPassword(auth,email,password);
 } catch(error) {
  status.textContent = "تعذر الدخول: " + error.message;
 }
};

onAuthStateChanged(auth, async user => {
 if (!user) {
  loginBox.style.display = "flex";
  return;
 }

 status.textContent = "تم تسجيل الدخول";
 loginBox.style.display = "none";

 const path = "users/" + user.uid + "/invoices";
 const cloudRef = ref(db,path);
 const key = "abu_abbas_invoices";

 try {
  const snapshot = await get(cloudRef);

  if (!snapshot.exists()) {
   const local = JSON.parse(localStorage.getItem(key)||"[]");
   const data = {};
   local.forEach(invoice => data[invoice.id] = invoice);
   if (Object.keys(data).length) await set(cloudRef,data);
  }

  onValue(cloudRef,snapshot => {
   const data = snapshot.val() || {};
   localStorage.setItem(key,JSON.stringify(Object.values(data)));
   if (typeof showInvoices === "function") showInvoices();
  });

 } catch(error) {
  alert("تعذر الاتصال بقاعدة البيانات: " + error.message);
 }
});

// مزامنة الحفظ مع Firebase
const oldSave = window.saveInvoice;
window.saveInvoice = async function() {
 oldSave();
 try {
  const user = auth.currentUser;
  if (!user) return;
  const invoices = JSON.parse(
   localStorage.getItem("abu_abbas_invoices") || "[]"
  );
  const data = {};
  invoices.forEach(i => data[i.id] = i);
  await set(ref(db,"users/"+user.uid+"/invoices"),data);
 } catch(error) {
  alert("تعذر مزامنة الفاتورة: " + error.message);
 }
};

// مزامنة الحذف مع Firebase
const oldDelete = window.deleteInvoice;
window.deleteInvoice = async function(id) {
 const before = localStorage.getItem("abu_abbas_invoices");
 oldDelete(id);
 const after = localStorage.getItem("abu_abbas_invoices");
 if (before === after) return;

 try {
  const user = auth.currentUser;
  if (!user) return;
  const invoices = JSON.parse(after || "[]");
  const data = {};
  invoices.forEach(i => data[i.id] = i);
  await set(ref(db,"users/"+user.uid+"/invoices"),data);
 } catch(error) {
  alert("تعذر مزامنة الحذف: " + error.message);
 }
};
</script>
